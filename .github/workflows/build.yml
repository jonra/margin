name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test, build and package (Apple silicon)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          uname -m

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Test
        run: swift test

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Margin.app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/bundle-app.sh

      - name: Sign app (Developer ID)
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: ./scripts/notarize.sh sign-app

      - name: Make Margin.dmg
        run: ./scripts/make-dmg.sh

      - name: Notarize DMG
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/notarize.sh notarize-dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Margin-dmg
          path: build/Margin.dmg
          if-no-files-found: error

      - name: Release notes
        if: github.event_name == 'push'
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "Built from \`${GITHUB_SHA::7}\` — all tests passed ([build log]($RUN_URL))."
            echo
            echo "**Requires a Mac with Apple silicon (M1 or later), macOS 14+.** Open the DMG and drag Margin to Applications."
            if [ "$HAS_SIGNING" != "true" ]; then
              echo
              echo "This build is not notarized yet. On first launch macOS will block it: open **System Settings › Privacy & Security** and click **Open Anyway**, or run \`xattr -dr com.apple.quarantine /Applications/Margin.app\`."
            fi
          } > build/release-notes.md

      - name: Publish latest build (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Margin.dmg \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (main)" --notes-file build/release-notes.md

      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Margin.dmg \
            --title "Margin $GITHUB_REF_NAME" --notes-file build/release-notes.md --generate-notes
